# Stage 1 of 4: ask for a pull request to be tested.
#
# TRUST: this workflow does nothing but write a small request (a pull request
# number and optional limits) and hand it on. It has no secrets, a read-only
# token, checks out nothing and builds nothing. The QA workflow treats the
# request as untrusted data: it asks GitHub itself which commit the pull
# request is at, and builds that.
#
# Do not add secrets, write permissions, a checkout or `pull_request_target`.
name: ReleaseProof request
# Quoted: an unquoted " #" would start a YAML comment and drop the number.
run-name: "ReleaseProof request for PR #${{ inputs.pr || github.event.pull_request.number }}"

on:
  # Automatic trigger. With this event GitHub takes THIS FILE from the pull
  # request, so a pull request can change what this workflow does. That is
  # acceptable only because nothing it produces is trusted. Keep it that way.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to test
        required: true
        type: string
      repository:
        description: Another public repository that holds the application, as owner/name. Empty means this repository
        type: string
      verify_only:
        description: Only build, start and check isolation. No ticket is read and no model is called
        type: boolean
        default: false
      full:
        description: Plan from scratch even if an earlier run of this pull request can be re-run
        type: boolean
        default: false
      max_usd:
        description: Lower this run's cost limit in US dollars (cannot raise the configured limit)
        type: string
      max_scenarios:
        description: Lower this run's limit on executed scenarios
        type: string
      max_minutes:
        description: Lower this run's time limit in minutes
        type: string
      disable_fallbacks:
        description: Do not send the model-fallback parameters
        type: boolean
        default: false
      routing:
        description: Model configuration for this run (default, or opus-planning)
        type: string
      executor_model:
        description: Model for scenario execution in this run (checked against an allow-list; empty uses the default)
        type: string

permissions:
  contents: read

concurrency:
  # A newer commit on the same pull request replaces the request in progress.
  group: releaseproof-request-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    # Draft pull requests wait until they are marked ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the request
        env:
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          TARGET: ${{ inputs.repository }}
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
          FULL: ${{ inputs.full || false }}
          MAX_USD: ${{ inputs.max_usd }}
          MAX_SCENARIOS: ${{ inputs.max_scenarios }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          DISABLE_FALLBACKS: ${{ inputs.disable_fallbacks || false }}
          EXECUTOR_MODEL: ${{ inputs.executor_model }}
          ROUTING: ${{ inputs.routing }}
        run: |
          case "$PR" in (''|*[!0-9]*) echo "Not a pull request number"; exit 1;; esac
          mkdir request
          jq -n --argjson pr "$PR" --arg repo "$TARGET" '{pr: $pr} + (if $repo == "" then {} else {repo: $repo} end)' > request/meta.json
          echo "$FULL" > request/full
          echo "$VERIFY_ONLY" > request/verify-only
          # Requests to tighten this run's limits. The QA workflow validates
          # them and will only ever lower its own limits, never raise them.
          jq -n --arg usd "$MAX_USD" --arg scenarios "$MAX_SCENARIOS" --arg minutes "$MAX_MINUTES" --arg nofallback "$DISABLE_FALLBACKS" --arg executor "$EXECUTOR_MODEL" --arg routing "$ROUTING" \
            '{maxUsd: $usd, maxScenarios: $scenarios, maxMinutes: $minutes, disableFallbacks: $nofallback, executorModel: $executor, routing: $routing}
             | with_entries(select(.value != ""))' > request/limits.json

      - name: Hand over to the QA workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: releaseproof-request
          path: request
          retention-days: 1
          if-no-files-found: error
