# Stages 2 to 4 of 4 for applications in this repository: build, test, report.
#
# TRUST: `workflow_run` always uses this file and the code from the default
# branch, so a pull request cannot change what runs here. The work is done by
# the reusable workflow next to this file; see its header for the boundaries.
name: ReleaseProof QA
run-name: ReleaseProof QA after "${{ github.event.workflow_run.display_title }}"

on:
  workflow_run:
    workflows: ["ReleaseProof request"]
    types: [completed]

permissions: {}

jobs:
  releaseproof:
    uses: ./.github/workflows/releaseproof-qa-reusable.yml
    # The most any job inside may hold. Each job there asks for less.
    permissions:
      contents: read
      actions: read
      pull-requests: write
      checks: write
    with:
      # Here the engine and the applications share a repository, so the engine
      # is this very commit of the default branch.
      releaseproof_repository: ${{ github.repository }}
      releaseproof_ref: ${{ github.sha }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
