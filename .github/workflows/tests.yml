# Runs the engine's own tests. No secrets, read-only token: on a pull request
# this executes the pull request's code, so it must never be given either.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Type-check
        working-directory: packages/agent
        run: npx tsc --noEmit -p .

      # The container tests need an application image under this name; without
      # it they are skipped.
      - name: Build the image the container tests use
        run: |
          docker build --quiet --file ci/sandbox/Dockerfile.node \
            --build-arg RP_RUN="node apps/timeoff/server.mjs" \
            --label releaseproof.sha=0000000000000000000000000000000000000000 \
            --tag releaseproof-app .

      - name: Test
        working-directory: packages/agent
        run: npm test

  # The tests that show a browser cannot get out of its network namespace need a
  # machine that lets one be made. The job above runs on a machine that does not,
  # and skips them; so they run here, alone, where a pass means it was shown.
  #
  # TRUST: as above, this executes the pull request's code: no secret, read-only
  # token, on a machine that is thrown away afterwards. Two steps use the
  # administrator's rights: the install (the browser library installs system
  # packages that way, as it does in the job above), and one step that lifts
  # this machine's rule against ordinary users making namespaces and then gives
  # up the administrator's rights for what follows. The tests run after that,
  # as the ordinary user, and make the namespace the way the engine prefers
  # to: as a user namespace's own administrator, which has no administrator's
  # rights over the machine's network.
  # A pull request can change this file, as it can any file: what protects the
  # repository is that this machine holds nothing, not what the file says.
  # Do not add a secret, a write permission, or a step that runs the tests as
  # the administrator.
  isolation:
    # A fixed version of the machine: the rule lifted below is that version's.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      # The last thing done with the administrator's rights. After it, what the
      # steps below run (the tests, and whatever they bring with them) cannot
      # make itself the administrator: not by asking, and not through the
      # container service, which is stopped.
      - name: Let an ordinary user of this machine make a namespace, and give up the administrator's rights
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo sh -c 'rm -f /etc/sudoers.d/runner /etc/sudoers.d/*runner* && ! grep -rqs "^runner" /etc/sudoers /etc/sudoers.d'
          sudo -k

      # RELEASEPROOF_REQUIRE_ISOLATION: if a namespace still cannot be made, the
      # tests fail and do not skip. A pass here is never a pass by omission.
      - name: Show that an isolated browser cannot get out
        working-directory: packages/agent
        env:
          RELEASEPROOF_REQUIRE_ISOLATION: "1"
        run: |
          test "$(id -u)" != 0
          ! sudo -n true 2>/dev/null
          ! docker info >/dev/null 2>&1
          npx tsx --test test/remote-isolated.test.ts

